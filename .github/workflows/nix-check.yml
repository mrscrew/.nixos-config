name: Nix Flake Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  nix-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Nix
      uses: DeterminateSystems/nix-installer-action@main
    
    - name: Setup Nix cache
      uses: DeterminateSystems/magic-nix-cache-action@main
    
    - name: Check Nix flake
      run: nix flake check --impure
    
    - name: Build configurations (optional)
      run: |
        # Раскомментируйте для проверки сборки конкретных хостов
        # nix build .#nixosConfigurations.master.config.system.build.toplevel
        # nix build .#nixosConfigurations.mama.config.system.build.toplevel
        echo "✅ Конфигурации проверены"
